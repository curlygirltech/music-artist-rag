<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Artist RAG Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1.5rem 1rem;
      background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
      text-align: center;
      border-bottom: 1px solid #0f3460;
    }
    header h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: #888;
      font-size: 0.95rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.4;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .message {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #0f3460, #16213e);
      border: 1px solid #0f3460;
    }
    .assistant {
      align-self: flex-start;
      background: #16213e;
      border: 1px solid #0f3460;
    }
    .loading {
      color: #888;
      font-style: italic;
    }
    .loading::after {
      content: '';
      animation: dots 1.5s infinite;
    }
    @keyframes dots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }
    form {
      display: flex;
      padding: 1rem;
      gap: 0.5rem;
      background: #16213e;
      border-top: 1px solid #0f3460;
    }
    input {
      flex: 1;
      padding: 0.85rem 1rem;
      border: 1px solid #0f3460;
      border-radius: 0.5rem;
      background: #1a1a2e;
      color: #eee;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #e94560; }
    input::placeholder { color: #666; }
    button {
      padding: 0.85rem 1.5rem;
      background: linear-gradient(135deg, #e94560, #c73e54);
      color: white;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:hover { transform: scale(1.02); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .powered-by {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.75rem;
      color: #555;
      background: #16213e;
    }
  </style>
</head>
<body>
  <header>
    <h1>Music Artist RAG</h1>
    <p>Ask questions about music artists and get AI-powered answers based on curated artist information from the knowledge base.</p>
  </header>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="input" placeholder="Ask about music artists..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
  <div class="powered-by">Powered by Claude + Voyage AI + Qdrant</div>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');

    function addMessage(text, role) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function sendMessage(message) {
      if (!message.trim()) return;

      addMessage(message, 'user');
      input.value = '';
      input.disabled = true;
      form.querySelector('button').disabled = true;

      const loadingDiv = addMessage('Thinking', 'assistant loading');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        loadingDiv.classList.remove('loading');

        if (data.isNewArtist) {
          loadingDiv.textContent = `✨ Added new artist to knowledge base!\n\n${data.response}`;
        } else {
          loadingDiv.textContent = data.response || data.error || 'Error occurred';
        }
      } catch (err) {
        loadingDiv.textContent = 'Failed to connect to server';
        loadingDiv.classList.remove('loading');
      }

      input.disabled = false;
      form.querySelector('button').disabled = false;
      input.focus();
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      sendMessage(input.value);
    });
  </script>
</body>
</html>
